[project]
name = "process-execution-counterfactuals"
version = "0.1.0"
description = "Research project on generating counterfactuals for process executions on Object-Centric Event Logs "
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "graphviz ==0.21",
  "ipykernel ==7.*",
  "networkx ==3.6.*",
  "pm4py ==2.7.*",
  "pydot ==4.0.*",
  "pygraphviz ==1.14",
  "scikit-learn==1.8.*",
  "torch ==2.9.*",
  "torch_geometric ==2.7.*",
  "pyyaml >=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_search", "src/gnn", "src/process_execution"]

[tool.hatch.build.targets.sdist]
include = ["src/**"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
